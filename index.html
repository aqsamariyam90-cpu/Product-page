<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqsa- Products</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Aqsa Products</a>
            <div class="text-white">
                Cart: <span id="cartCount" class="badge bg-warning text-dark">0</span>
            </div>
        </div>
    </nav>
    <!-- Heading -->
    <header class="container text-center my-5">
        <h1>Our Products</h1>
        <p class="text-muted">Find your favorite products at great prices.</p>
    </header>
    <!-- Products -->
    <main class="container">
        <div class="row g-4" id="productList">
            <!-- JavaScript will display products here -->
        </div>
        <!-- Cart -->
        <section class="cart-box my-5 p-4">
            <h2 class="mb-3">Shopping Cart</h2>

            <div id="cartItems">
                Your cart is empty.
            </div>
            <hr>
            <h4>Total: $<span id="cartTotal">0.00</span></h4>
        </section>
    </main>
    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">@ 2026 Aqsa | Product Store</p>
    </footer>
    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
